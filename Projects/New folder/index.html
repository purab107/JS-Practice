    let intervalId;
    // VARIABLE USED FOR INTERVAL ID

    function printOnInterval(message){
        console.log(message, Date.now().toLocaleString())
    }

    const intervalSetter = function () {
        console.log('inteval started')
        intervalId = setInterval(printOnInterval, 1000, "hi")
    }

    document.getElementById('start').addEventListener('click', intervalSetter)

    document.getElementById('stop').addEventListener('click', function () {
        clearInterval(intervalId)
        // needs an interval ID (NOT FUNCTION)
        console.log('interval stopped')
    })
